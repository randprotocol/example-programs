[package]
name = "perp"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "RPL-2 example: a perpetual-futures market priced by an operator, with an LP pool as every trader's counterparty"

# Built by ./build.sh inside a circuits checkout ($CIRCUITS/example-programs/perp), where guest-sdk
# sits two directories up and the kit is copied beside it.
[dependencies]
guest-sdk = { path = "../../guest-sdk" }
perp-core = { path = "core" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1

[workspace]
exclude = ["core"]

[package]
name = "amm-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The amm example's rules: one constant-product pool of RAND and one token"

# no_std on the guest, std on a host (the `plan` tool and the tests). The guest's build copies
# this crate inside it and the kit beside it ($CIRCUITS/example-programs/{amm/core,kit}).
[dependencies]
rpl2-kit = { path = "../../kit" }

[[bin]]
name = "plan"
path = "src/bin/plan.rs"

[workspace]

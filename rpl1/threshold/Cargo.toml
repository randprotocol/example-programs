[package]
name = "threshold"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "RPL-1 example: prove a private amount is at least a public threshold"

# Built by ./build.sh inside a circuits checkout ($CIRCUITS/example-programs/threshold), where
# guest-sdk sits two directories up.
[dependencies]
guest-sdk = { path = "../../guest-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1

[workspace]

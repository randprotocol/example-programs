[package]
name = "eligibility-hash"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Computes eligibility's leaf and node hashes off chain (never deployed)"

# Built by ../build.sh beside the eligibility guest, inside a circuits checkout
# ($CIRCUITS/example-programs/eligibility/hash), three directories below guest-sdk.
[dependencies]
guest-sdk = { path = "../../../guest-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1

[workspace]
